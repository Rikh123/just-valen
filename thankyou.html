<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You 💖</title>
    <link rel="stylesheet" href="css/lastpage.css" />
  </head>
  <body>
    <div id="thankyou">💖 Thank You! 💖</div>

    <img id="rizz" src="rizz.gif" alt="Rizzler God" class="responsive" />
    <br />

    <audio id="bgMusic" loop>
      <source src="congratulations.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <h1>Don't go yet! 🥺</h1>

    <button class="button" onclick="location.href='date.html'">
      Click me UWU 💞
    </button>

    <script>
      // Ensures audio plays when user interacts (fix for mobile)
      document.addEventListener("click", function () {
        let audio = document.getElementById("bgMusic");
        if (audio.paused) {
          audio.play();
        }
      });

      // Try playing on page load (may be blocked on mobile)
      window.onload = function () {
        let audio = document.getElementById("bgMusic");
        audio.play().catch(() => console.log("Autoplay blocked! Waiting for user interaction."));
      };
    </script>
  </body>
</html>
